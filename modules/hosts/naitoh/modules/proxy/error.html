<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>@title@</title>

    <style>
        :root {
            color-scheme: light dark;
            --bg: #fafafa;
            --fg: #18181b;
            --muted: #71717a;
            --button: #fff;
            --border: #d4d4d8;
            --hover: #e4e4e7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111;
                --fg: #e4e4e7;
                --muted: #a1a1aa;
                --button: #252525;
                --border: #3f3f46;
                --hover: #333;
            }
        }

        body {
            min-height: 100dvh;
            box-sizing: border-box;
            margin: 0;
            padding: 24px;
            display: grid;
            place-items: center;
            background: var(--bg);
            color: var(--fg);
            font: 15px/1.6 system-ui, sans-serif;
            text-align: center;
        }

        main {
            max-width: 420px;
        }

        small {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        h1 {
            margin: 8px 0 12px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -.03em;
        }

        p {
            margin: 0 0 28px;
            color: var(--muted);
        }

        a {
            display: inline-block;
            padding: 8px 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--button);
            color: var(--fg);
            text-decoration: none;
            font-weight: 500;
            transition: background 150ms;
        }

        a:hover {
            background: var(--hover);
        }

        a:focus-visible {
            outline: 2px solid var(--muted);
            outline-offset: 4px;
        }
    </style>
</head>

<body>
    <main>
        <small>@code@</small>
        <h1>@title@</h1>
        <p>@message@</p>
        <a href="@href@">@action@</a>
    </main>
</body>

</html>
