id = "rylos/tailnet"
name = "Tailnet"
version = "2.3.0"
plugin_api = 43
author = "Marco Ziliani"
license = "MIT"
dependencies = ["tailscale", "ssh", "xdg-user-dir", "gio", "xdg-open"]
tags = ["bar", "panel", "launcher", "service", "network", "privacy", "utility"]
icon = "topology-star-3"
description = "Tailscale status and control, including tailnet switching."

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 5
min = 1
max = 60

[[setting]]
key = "hide_mullvad"
type = "bool"
label_key = "settings.hide_mullvad.label"
description_key = "settings.hide_mullvad.description"
default = true

[[setting]]
key = "hide_offline"
type = "bool"
label_key = "settings.hide_offline.label"
description_key = "settings.hide_offline.description"
default = false

[[setting]]
key = "taildrop_dir"
type = "folder"
label_key = "settings.taildrop_dir.label"
description_key = "settings.taildrop_dir.description"
default = ""
advanced = true

[[setting]]
key = "ssh_username"
type = "string"
label_key = "settings.ssh_username.label"
description_key = "settings.ssh_username.description"
default = ""
advanced = true

[[setting]]
key = "tailscale_bin"
type = "string"
label_key = "settings.tailscale_bin.label"
description_key = "settings.tailscale_bin.description"
default = ""
advanced = true

[[setting]]
key = "admin_url"
type = "string"
label_key = "settings.admin_url.label"
description_key = "settings.admin_url.description"
default = ""
advanced = true

[[service]]
id = "poller"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"

[[widget.setting]]
key = "show_ip"
type = "bool"
label_key = "settings.show_ip.label"
description_key = "settings.show_ip.description"
default = false

[[widget.setting]]
key = "hide_not_installed"
type = "bool"
label_key = "settings.hide_not_installed.label"
description_key = "settings.hide_not_installed.description"
default = false

[[panel]]
id = "panel"
entry = "panel.luau"
width = 420
height = 540
placement = "attached"
position = "auto"
open_near_click = true

[[launcher_provider]]
id = "hosts"
entry = "launcher.luau"
prefix = "tn"
glyph = "topology-star-3"
include_in_global_search = false

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"

[[desktop_widget]]
id = "desktop"
entry = "desktop.luau"
