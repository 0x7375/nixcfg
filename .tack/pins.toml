[shorturls]
gh = "github:{path}"
cb = "git+https://codeberg.org/{path}"
codeberg = "git+ssh://git@codeberg.org/{path}"                # private repos
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.xz"

[all_follow]
nixpkgs = ["nixpkgs", "nixpkgs-lib"]
nixpkgs-nixcord = "nixpkgs"
nix-darwin = "nix-darwin"
flake-parts = "flake-parts"
flake-compat = "flake-compat"

# nixpkgs
[inputs.nixpkgs]
url = "gh:nixos/nixpkgs/nixos-26.05"

[inputs.nixpkgs-darwin]
url = "gh:nixos/nixpkgs/nixpkgs-26.05-darwin"

[inputs.nixpkgs-unstable]
url = "nixpkgs:nixos-unstable"

[inputs.auto-update]
url = "nixpkgs:nixos-unstable"


[inputs.flake-parts]
url = "gh:Ladas552/flake-parts"

[inputs.mnw]
url = "gh:Gerg-L/mnw"

[inputs.nixflix]
url = "gh:kiriwalawren/nixflix"
follows = { nixpkgs = "auto-update" }

# darwin
[inputs.nix-darwin]
url = "gh:nix-darwin/nix-darwin/nix-darwin-26.05"
follows = { nixpkgs = "nixpkgs-darwin" }

[inputs.nix-homebrew]
url = "gh:zhaofengli/nix-homebrew"

# [inputs.nixos-wsl]
# url = "gh:nix-community/NixOS-WSL"


# asahi
[inputs.apple-silicon]
url = "gh:nix-community/nixos-apple-silicon"
exclude_follow = ["nixpkgs"]

[inputs.asahi-firmware]
url = "codeberg:0x7E/asahi-firmware"
type = "fetch"

[inputs.titdb]
url = "gh:0x7375/titdb-nix"


[inputs.hjem]
url = "gh:feel-co/hjem"

# secrets
[inputs.sops-nix]
url = "gh:Mic92/sops-nix"

[inputs.token2]
url = "codeberg:0x7E/token2-totp-cli"
type = "fetch"


[inputs.disko]
url = "gh:nix-community/disko/latest"

[inputs.preservation]
url = "gh:nix-community/preservation"

[inputs.helium]
url = "gh:amaanq/helium-flake"
follows = { nixpkgs = "auto-update" }

[inputs.zen-browser]
url = "gh:youwen5/zen-browser-flake"
follows = { nixpkgs = "auto-update" }

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"

[inputs.npr]
url = "gh:manic-systems/npr"

[inputs.nd]
url = "cb:0x7E/nd"

[inputs.graine]
url = "cb:0x7E/graine"

[inputs.karabiner-ts]
url = "cb:0x7E/karabiner-ts"

[inputs.nixcord]
url = "gh:4evy/nixcord"

[inputs.mango]
url = "gh:mangowm/mango"

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/v5.4.1"
